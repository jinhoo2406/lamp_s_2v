<html>
<head>
    <style>
        body {
            background-color: white;
        }

        #div1 {
            height: 10%;
            background-color: orange;
            font-size: 3em;
            color: yellow;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #div2 {
            height: 80%;
            background-color: yellow;
            text-align: center;
        }

        #div3 {
            height: 10%;
            background-color: orange;
            font-size: 3em;
            color: yellow;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #lamp1, #lamp2, #lamp3, #lamp4 {
            height: 20%;
            width: 20%;
            accent-color: orange;
        }

        #btn1 {
            font-size: 3em;
            height: 15%;
            width: 25%;
            background-color: orange;
            color: yellow;
        }

        #btn2 {
            font-size: 3em;
            height: 15%;
            width: 25%;
            background-color: orange;
            color: yellow;
        }

        #btn3 {
            font-size: 3em;
            height: 15%;
            width: 25%;
            background-color: orange;
            color: yellow;
        }

        #txt1 {
            width:30%;
	    height:20%;
            background-color:yellow;
            color:red;
	    font-size:5em;
	    text-align:center;
        }

    </style>

    <script>
        let step = 0;

        setInterval(timer1, 500);

        function timer1() {
            switch (step) {
                case 100:
                    step = 1;
                    break;

                case 200:
                    break;

                case 300:
                    document.getElementById('lamp1').checked = false;
                    document.getElementById('lamp2').checked = false;
                    document.getElementById('lamp3').checked = false;
                    document.getElementById('lamp4').checked = false;
                    step = 0;
                    break;

                case 1:
                    document.getElementById('lamp1').checked = true;
                    document.getElementById('lamp2').checked = false;
                    document.getElementById('lamp3').checked = false;
                    document.getElementById('lamp4').checked = false;
                    step = 2;
                    break;

                case 2:
                    document.getElementById('lamp1').checked = false;
                    document.getElementById('lamp2').checked = true;
                    document.getElementById('lamp3').checked = true;
                    document.getElementById('lamp4').checked = false;
                    step = 3;
                    break;

                case 3:
                    document.getElementById('lamp1').checked = false;
                    document.getElementById('lamp2').checked = true;
                    document.getElementById('lamp3').checked = true;
                    document.getElementById('lamp4').checked = true;
                    step = 4;
                    break;

                case 4:
                    document.getElementById('lamp1').checked = true;
                    document.getElementById('lamp2').checked = true;
                    document.getElementById('lamp3').checked = true;
                    document.getElementById('lamp4').checked = true;
                    step = 1;
                    break;
            }
		    document.getElementById('txt1').value = step;
        }

        function start() {
            step = 100;
        }

        function pause() {
            step = 200;
        }

        function stop() {
            step = 300;
        }
    </script>
</head>

<body>
    <div id="div1">
        Lamp Sequence
    </div>

    <div id="div2">
        <br><br><br><br><br>

        <input type="radio" id="lamp1">
        <input type="radio" id="lamp2">
        <input type="radio" id="lamp3">
        <input type="radio" id="lamp4">

        <br><br><br><br><br>

	<input type='text' id='txt1'>

        <button id="btn1" onclick="start();">START</button>
        &nbsp;&nbsp;&nbsp;&nbsp;

        <button id="btn2" onclick="pause();">PAUSE</button>
        &nbsp;&nbsp;&nbsp;&nbsp;

        <button id="btn3" onclick="stop();">STOP</button>
    </div>

    <div id="div3">
        Mechatronics P_jinhoo
    </div>
</body>
</html>
